# Newsletter Content Guidelines
# ==============================
# Add examples of content that's a perfect fit for each newsletter.
# The system will use these to better score and filter incoming content.
#
# How to use:
# 1. When you see an article that's exactly what you want, add it below
# 2. Include the title and a brief note on WHY it's a good fit
# 3. The system will learn from these patterns
#
# You can also add examples of content to EXCLUDE (things that slip through
# but shouldn't be included)

ai:
  # Examples of GOOD content - exactly what we want
  good_examples:
    - title: "OpenAI announces GPT-5 release date"
      why: "Major product announcement from key AI company"
    - title: "Claude 3.5 Sonnet benchmarks show 40% improvement"
      why: "Significant technical advancement with measurable results"
    - title: "Google DeepMind publishes new reasoning research"
      why: "Research breakthrough from major lab"
    # Add your examples here as you find them:
    # - title: "Example article title"
    #   why: "Why this is relevant"

  # Examples of BAD content - should be filtered out
  bad_examples:
    - title: "I just cancelled my subscription"
      why: "Personal opinion/rant, not industry news"
    - title: "Funny meme about ChatGPT"
      why: "Entertainment, not substantive content"
    # Add examples of content that slipped through but shouldn't have:
    # - title: "Example bad article"
    #   why: "Why this should be excluded"

  # Keywords that strongly indicate GOOD content
  priority_keywords:
    - "breakthrough"
    - "announces"
    - "launches"
    - "research paper"
    - "benchmark"
    - "open source"
    - "API"
    - "release"

  # Keywords that indicate content should be EXCLUDED
  exclude_keywords:
    - "meme"
    - "funny"
    - "cancelled my subscription"
    - "rant"
    - "unpopular opinion"

robotics:
