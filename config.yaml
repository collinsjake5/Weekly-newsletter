# Weekly Newsletter Builder Configuration
# ========================================

# Newsletter definitions
newsletters:
  ai:
    name: "AI Weekly Digest"
    description: "Weekly roundup of artificial intelligence news, research, and discussions"
    topics:
      - "artificial intelligence"
      - "machine learning"
      - "large language models"
      - "LLM"
      - "GPT"
      - "Claude"
      - "deep learning"
      - "neural networks"
      - "AI safety"
      - "generative AI"

    sources:
      reddit:
        - "MachineLearning"
        - "artificial"
        - "LocalLLaMA"
        - "singularity"
        - "ChatGPT"
        - "ClaudeAI"
      hackernews:
        enabled: true
        min_score: 50
      arxiv:
        categories:
          - "cs.AI"
          - "cs.LG"
          - "cs.CL"
        max_results: 20
      rss:
        - name: "OpenAI Blog"
          url: "https://openai.com/blog/rss.xml"
        - name: "Anthropic Blog"
          url: "https://www.anthropic.com/rss.xml"
        - name: "Google AI Blog"
          url: "https://blog.google/technology/ai/rss/"
        - name: "MIT Technology Review AI"
          url: "https://www.technologyreview.com/topic/artificial-intelligence/feed"
        - name: "The Batch"
          url: "https://www.deeplearning.ai/the-batch/feed/"

