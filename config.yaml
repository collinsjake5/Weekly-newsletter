# Collection settings
collection:
  # Number of days to look back (7 = weekly)
  lookback_days: 7

  # Maximum items per source before filtering
  max_items_per_source: 50

  # Minimum engagement score to include
  min_engagement_score: 10

# Scoring weights
scoring:
  # How much to weight recency (newer = higher score)
  # Reduced to give older high-engagement content fair consideration
  recency_weight: 0.15

  # How much to weight engagement (upvotes, comments)
  engagement_weight: 0.45

  # How much to weight relevance to topics
  # Increased to filter out off-topic content
  relevance_weight: 0.40

  # Minimum relevance score required (0-1, higher = stricter filtering)
  min_relevance_score: 0.03

# Output settings
output:
  # Output directory for generated newsletters
  directory: "output"

  # Formats to generate
  formats:
    - "markdown"
    - "json"

  # Maximum items in final newsletter (quality over quantity)
  max_items: 20

  # Include full summaries or just headlines
  include_summaries: true

# Web search settings (for trending topics)
websearch:
  enabled: true
  queries_per_newsletter: 3
