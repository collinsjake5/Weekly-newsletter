      - "Figure 01"
      - "Figure 02"
      - "Tesla Optimus"
      - "Optimus robot"
      - "Boston Dynamics Atlas"
      - "Agility Robotics"
      - "Digit robot"
      - "Apptronik"
      - "1X Technologies"
      - "Sanctuary AI"
      - "Fourier Intelligence"

      # Mobile Robots (AMR/AGV)
      - "AMR"
      - "autonomous mobile robot"
      - "AGV"
      - "automated guided vehicle"
      - "warehouse robot"
      - "logistics robot"
      - "Locus Robotics"
      - "6 River Systems"
      - "Fetch Robotics"
      - "MiR"
      - "mobile industrial robots"
      - "Kiva"
      - "Amazon robotics"

      # Industrial Arms & Cobots
      - "robotic arm"
      - "robot arm"
      - "cobot"
      - "collaborative robot"
      - "industrial robot"
      - "FANUC"
      - "KUKA"
      - "ABB robot"
      - "Universal Robots"
      - "Yaskawa"
      - "pick and place"
      - "palletizing"
      - "welding robot"
      - "assembly robot"

      # Drones & Aerial
      - "industrial drone"
      - "warehouse drone"
      - "inventory drone"
      - "inspection drone"
      - "drone delivery"

      # Manufacturing & Automation
      - "factory automation"
      - "manufacturing automation"
      - "smart factory"
      - "Industry 4.0"
      - "lights out manufacturing"
      - "robotic cell"
      - "automation"
      - "material handling"
      - "bin picking"
      - "machine tending"

      # Vision & AI for Manufacturing
      - "machine vision"
      - "robot vision"
      - "visual inspection"
      - "defect detection"
      - "quality control robot"

    sources:
      reddit:
        - "robotics"
        - "Automate"
        - "IndustrialAutomation"
        - "PLC"
        - "manufacturing"
        - "drones"
        - "BostonDynamics"
        - "warehouseworkers"
        - "supplychain"
        - "automation"
      hackernews:
        enabled: true
        min_score: 25
      arxiv:
        categories:
          - "cs.RO"  # Robotics
          - "cs.SY"  # Systems and Control
        max_results: 20
      rss:
        - name: "IEEE Spectrum Robotics"
          url: "https://spectrum.ieee.org/feeds/topic/robotics.rss"
        - name: "The Robot Report"
          url: "https://www.therobotreport.com/feed/"
        - name: "Robohub"
          url: "https://robohub.org/feed/"
        - name: "Automation World"
          url: "https://www.automationworld.com/rss.xml"
        - name: "Modern Materials Handling"
          url: "https://www.mmh.com/rss"
        - name: "Robotics Business Review"
          url: "https://www.roboticsbusinessreview.com/feed/"
        - name: "Assembly Magazine"
          url: "https://www.assemblymag.com/rss"
        - name: "Material Handling & Logistics"
          url: "https://www.mhlnews.com/rss"

# Collection settings
collection:
  # Number of days to look back (7 = weekly)
  lookback_days: 7

  # Maximum items per source before filtering
  max_items_per_source: 50

  # Minimum engagement score to include
  min_engagement_score: 10

# Scoring weights
scoring:
  # How much to weight recency (newer = higher score)
  recency_weight: 0.3

  # How much to weight engagement (upvotes, comments)
  engagement_weight: 0.4

  # How much to weight relevance to topics
  relevance_weight: 0.3

# Output settings
output:
  # Output directory for generated newsletters
  directory: "output"

  # Formats to generate
  formats:
    - "markdown"
    - "json"

  # Maximum items in final newsletter
  max_items: 25

  # Include full summaries or just headlines
  include_summaries: true

# Web search settings (for trending topics)
websearch:
  enabled: true
  queries_per_newsletter: 3
